[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composable-jev"
version = "1.0.0"
description = "A library to chain Jev calls, for the deranged and enlightened"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["typesafe", "jev", "system-one", "llm", "graph", "chaining"]
authors = [{ name = "Fox Islam", email = "foxislam@outlook.com" }]
dependencies = ["typesafe-sdk>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["python/src/composable_jev"]

# The data is not Python, and both other implementations read the same files
[tool.hatch.build.targets.wheel.force-include]
"data" = "composable_jev/data"

[tool.hatch.build.targets.sdist]
include = ["/python", "/data", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src", "python/tests"]

[tool.ruff]
line-length = 130
src = ["python/src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["RUF001", "UP007", "UP045", "E741"]
